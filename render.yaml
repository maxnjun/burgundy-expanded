# Free test service only. Connect an account-owned Upstash Free database before use.
services:
  - type: web
    name: burgundy-expanded-staging
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    numInstances: 1
    buildCommand: npm ci --include=dev && NEXT_PUBLIC_GAME_VERSION=$RENDER_GIT_COMMIT npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: BURGUNDY_STORAGE
        value: upstash
      - key: BURGUNDY_ROOM_NAMESPACE
        value: staging
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "1"
