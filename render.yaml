# Applying this Blueprint creates one PAID test service. Obtain the owner's approval first.
services:
  - type: web
    name: burgundy-expanded-staging
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: off
    numInstances: 1
    buildCommand: npm ci --include=dev && NEXT_PUBLIC_GAME_VERSION=$RENDER_GIT_COMMIT npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: staging-rooms
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: BURGUNDY_DATA_DIR
        value: /var/data/burgundy-staging
      - key: TRUST_PROXY
        value: "1"
