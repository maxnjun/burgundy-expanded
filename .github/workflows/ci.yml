name: Game CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow==12.3.0
      # Source-authoring review also uses private, deliberately uncommitted originals.
      - run: python scripts/validate-deployment-assets.py
      - run: npm run test:core && npm run test:boards && npm run lint
      - run: npm run build && npx tsc --noEmit
      - run: npm run test:deployment
        env:
          TEST_GAME_VERSION: ${{ github.sha }}
      - name: Install Playwright browsers and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps msedge webkit
      - name: Prepare Korean screenshot font (5 minute limit)
        timeout-minutes: 5
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 install -y fonts-noto-cjk
          korean_fonts="$(fc-list ':lang=ko' family)"
          test -n "$korean_fonts"
          printf '%s\n' "$korean_fonts"
          fc-match 'sans-serif:lang=ko'
      - name: Full PC browser regression
        run: npm run test:browser -- --project=desktop-1280
      - name: Chrome mobile browser regression
        run: npm run test:browser -- tests/browser/design-settings.spec.ts tests/browser/vineyard-assets.spec.ts tests/browser/ver3.spec.ts tests/browser/ver2.spec.ts tests/browser/shield-assets.spec.ts tests/browser/shield-castles.spec.ts tests/browser/fifteen-online.spec.ts tests/browser/fifteen-fixes.spec.ts tests/browser/online-recovery.spec.ts tests/browser/score-pages.spec.ts tests/browser/dice-readability.spec.ts tests/browser/online-identity.spec.ts tests/browser/online-board.spec.ts tests/browser/online-controls.spec.ts tests/browser/internet-online.spec.ts tests/browser/tile-help.spec.ts tests/browser/fixed-vine-reward.spec.ts --project=mobile-390
      - name: iPhone WebKit browser regression
        run: npm run test:browser -- tests/browser/design-settings.spec.ts tests/browser/vineyard-assets.spec.ts tests/browser/ver3.spec.ts tests/browser/ver2.spec.ts tests/browser/shield-assets.spec.ts tests/browser/shield-castles.spec.ts tests/browser/fifteen-online.spec.ts tests/browser/fifteen-fixes.spec.ts tests/browser/online-recovery.spec.ts tests/browser/score-pages.spec.ts tests/browser/dice-readability.spec.ts tests/browser/online-identity.spec.ts tests/browser/online-board.spec.ts tests/browser/online-controls.spec.ts tests/browser/internet-online.spec.ts tests/browser/fixed-vine-reward.spec.ts --project=iphone-webkit
      - name: Verify the deploy-time versioned build
        run: npm run build && npx tsc --noEmit
        env:
          NEXT_PUBLIC_GAME_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
